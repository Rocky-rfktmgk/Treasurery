<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Treasurery | Your Clubs</title>

<style>
:root{
  --space:#03050a;
  --card:rgba(12,18,30,.82);
  --text:#f7f5ef;
  --muted:#9099aa;
  --border:rgba(255,255,255,.09);

  --gold:#d7b15c;
  --gold2:#f4d88f;
  --gold3:#997126;
  --gold-soft:rgba(215,177,92,.12);

  --red:#ef7079;
  --red-soft:rgba(239,112,121,.10);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#03050a;
}

body{
  min-height:100vh;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}

/* MOVING STARFIELD */

#starfield{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;

  background:
    radial-gradient(circle at 18% 20%,rgba(43,79,140,.18),transparent 30%),
    radial-gradient(circle at 82% 72%,rgba(215,177,92,.08),transparent 30%),
    radial-gradient(circle at 55% 45%,rgba(55,78,118,.08),transparent 35%),
    linear-gradient(145deg,#020307,#050812 52%,#020306);
}

.space-glow{
  position:fixed;
  width:750px;
  height:750px;
  z-index:0;
  border-radius:50%;
  filter:blur(120px);
  pointer-events:none;
  opacity:.12;
}

.glow-one{
  left:-300px;
  top:-380px;
  background:#31547f;
}

.glow-two{
  right:-350px;
  bottom:-400px;
  background:#8e6d2c;
}

/* PAGE */

.page{
  position:relative;
  z-index:2;
  min-height:100vh;
}

.topbar{
  height:74px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 clamp(22px,5vw,70px);

  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(3,5,10,.65);
  backdrop-filter:blur(18px);

  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:13px;

  background:linear-gradient(145deg,var(--gold2),var(--gold),var(--gold3));
  color:#151109;

  font-weight:1000;
  font-size:18px;
}

.brand-name{
  color:#fff5dc;
  font-size:18px;
  font-weight:900;
}

.account{
  display:flex;
  align-items:center;
  gap:13px;
}

.user-name{
  color:#c2c9d4;
  font-size:12px;
}

.logout-btn{
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:9px;
  background:rgba(255,255,255,.035);
  color:#cdd3dd;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.content{
  width:min(1180px,calc(100% - 40px));
  margin:0 auto;
  padding:58px 0 70px;
}

.hero{
  display:flex;
  justify-content:space-between;
  gap:25px;
  align-items:flex-end;
  margin-bottom:30px;
}

.hero h1{
  margin:0 0 7px;
  color:#fff7e6;
  font-size:clamp(33px,4vw,48px);
  letter-spacing:-1.8px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.primary,
.secondary,
.restore-btn{
  border-radius:10px;
  padding:11px 15px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}

.primary{
  border:0;
  color:#171208;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 9px 28px rgba(215,177,92,.13);
}

.secondary{
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.045);
  color:#e0e5ec;
}

.section-title{
  margin:38px 0 14px;
  color:#8c96a7;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.club-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.club-card{
  position:relative;
  padding:20px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;

  background:linear-gradient(145deg,rgba(16,24,40,.88),rgba(8,13,23,.82));
  box-shadow:0 18px 50px rgba(0,0,0,.30);

  backdrop-filter:blur(16px);

  transition:.2s;
}

.club-card:hover{
  transform:translateY(-3px);
  border-color:rgba(215,177,92,.23);
  box-shadow:0 22px 60px rgba(0,0,0,.38);
}

.club-top{
  display:flex;
  gap:13px;
  align-items:center;
}

.club-logo{
  width:54px;
  height:54px;
  flex:none;

  display:grid;
  place-items:center;
  overflow:hidden;

  border-radius:15px;

  background:linear-gradient(145deg,var(--gold2),var(--gold),var(--gold3));
  color:#151109;

  font-size:17px;
  font-weight:1000;
}

.club-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.club-title{
  min-width:0;
}

.club-title h3{
  margin:0;
  color:#f8f4e9;
  font-size:16px;
}

.role{
  margin-top:5px;
  color:var(--gold2);
  font-size:10px;
  font-weight:800;
}

.owner-badge{
  display:inline-block;
  margin-left:5px;
  padding:3px 6px;

  border-radius:999px;
  background:var(--gold-soft);
  color:var(--gold2);

  font-size:8px;
  font-weight:900;
}

.club-details{
  margin:18px 0;
  display:grid;
  gap:10px;
}

.detail{
  display:flex;
  justify-content:space-between;
  gap:15px;
  font-size:10px;
}

.detail span:first-child{
  color:#687386;
}

.detail strong{
  text-align:right;
  color:#bec6d2;
}

.invite-code{
  color:var(--gold2)!important;
  letter-spacing:.8px;
}

.card-actions{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.open-btn{
  border:0;
  border-radius:9px;
  padding:10px 12px;

  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#151109;

  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.copy-btn{
  border:1px solid rgba(255,255,255,.08);
  border-radius:9px;
  padding:10px 11px;

  background:rgba(255,255,255,.035);
  color:#c7ced8;

  font-size:10px;
  font-weight:800;
  cursor:pointer;
}

.empty{
  grid-column:1/-1;
  padding:42px 22px;
  text-align:center;

  border:1px dashed rgba(255,255,255,.10);
  border-radius:17px;

  background:rgba(10,15,25,.58);
  color:var(--muted);
}

.empty h3{
  margin:0 0 8px;
  color:#f0ede5;
}

/* ARCHIVED */

.archived-card{
  opacity:.72;
}

.archived-actions{
  margin-top:15px;
}

.restore-btn{
  border:1px solid rgba(215,177,92,.18);
  background:var(--gold-soft);
  color:var(--gold2);
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(1,3,7,.78);
  backdrop-filter:blur(10px);
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(500px,100%);
  max-height:92vh;
  overflow:auto;

  padding:24px;

  border:1px solid rgba(215,177,92,.15);
  border-radius:19px;

  background:linear-gradient(145deg,#111a2a,#080d17);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
  color:#fff6df;
  font-size:20px;
}

.close-btn{
  width:32px;
  height:32px;

  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;

  background:rgba(255,255,255,.045);
  color:#d8dee8;

  font-size:18px;
  cursor:pointer;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;

  color:#d8dee8;
  font-size:10px;
  font-weight:850;
}

.field input{
  width:100%;

  padding:12px 13px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:10px;

  background:rgba(2,5,10,.58);
  color:#f2f4f8;

  outline:none;
}

.field input:focus{
  border-color:rgba(215,177,92,.55);
  box-shadow:0 0 0 3px rgba(215,177,92,.08);
}

.field-help{
  margin-top:6px;
  color:#667185;
  font-size:9px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

.message{
  display:none;
  margin-bottom:14px;
  padding:10px 12px;

  border-radius:9px;

  color:#ff9ba2;
  background:var(--red-soft);
  border:1px solid rgba(239,112,121,.17);

  font-size:10px;
}

.message.show{
  display:block;
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  z-index:999;

  display:grid;
  place-items:center;
  text-align:center;

  background:radial-gradient(circle at center,#101725,#03050a 70%);
}

.loading h2{
  margin:0 0 5px;
  color:var(--gold2);
}

.loading p{
  margin:0;
  color:var(--muted);
  font-size:11px;
}

.hidden{
  display:none!important;
}

@media(max-width:950px){
  .club-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){

  .topbar{
    padding:0 17px;
  }

  .user-name{
    display:none;
  }

  .content{
    width:min(100% - 26px,1180px);
    padding-top:35px;
  }

  .hero{
    align-items:flex-start;
    flex-direction:column;
  }

  .club-grid{
    grid-template-columns:1fr;
  }

  .actions{
    width:100%;
  }

  .actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<canvas id="starfield"></canvas>

<div class="space-glow glow-one"></div>
<div class="space-glow glow-two"></div>

<div id="loadingScreen" class="loading">
  <div>
    <h2>Treasurery</h2>
    <p>Loading your financial universe...</p>
  </div>
</div>

<div class="page">

<header class="topbar">

  <div class="brand">
    <div class="logo">T</div>
    <div class="brand-name">Treasurery</div>
  </div>

  <div class="account">
    <div class="user-name" id="userName">Officer</div>

    <button class="logout-btn" id="logoutButton">
      Log Out
    </button>
  </div>

</header>

<main class="content">

  <div class="hero">

    <div>
      <h1>Your Clubs</h1>
      <p>

      </p>
    </div>

    <div class="actions">

      <button class="secondary" onclick="openJoinModal()">
        Join Club

      <button class="primary" onclick="openCreateModal()">

  </div>

  <div class="section-title">
    Active Workspaces
  </div>

  <div class="club-grid" id="activeClubGrid"></div>

  <div id="archivedSection" class="hidden">

    <div class="section-title">
      Archived
    </div>

    <div class="club-grid" id="archivedClubGrid"></div>

  </div>

</main>

</div>

<!-- CREATE CLUB -->

<div class="modal-backdrop" id="createModal">

<div class="modal">

  <div class="modal-head">

    <h2>Create Club</h2>

    <button class="close-btn" onclick="closeCreateModal()">
      ×
    </button>

  </div>

  <div id="createMessage" class="message"></div>

  <form id="createClubForm">

    <div class="field">
      <label>Club Name</label>

      <input
        id="createClubName"
        type="text"
        placeholder="Example: Senior Class"
        required
      >
    </div>

    <div class="field">
      <label>Sponsor Name</label>

      <input
        id="createSponsorName"
        type="text"
        placeholder="Optional"
      >
    </div>

    <div class="field">
      <label>Club Logo</label>

      <input
        id="createClubLogo"
        type="file"
        accept="image/png,image/jpeg,image/webp"
      >

      <div class="field-help">
        Optional. PNG, JPG, or WEBP.
      </div>
    </div>

    <div class="modal-actions">

      <button
        type="button"
        class="secondary"
        onclick="closeCreateModal()"
      >
        Cancel
      </button>

      <button type="submit" class="primary">
        Create Club
      </button>

    </div>

  </form>

</div>
</div>

<!-- JOIN CLUB -->

<div class="modal-backdrop" id="joinModal">

<div class="modal">

  <div class="modal-head">

    <h2>Join Club</h2>

    <button class="close-btn" onclick="closeJoinModal()">
      ×
    </button>

  </div>

  <div id="joinMessage" class="message"></div>

  <form id="joinClubForm">

    <div class="field">

      <label>Invite Code</label>

      <input

    <div class="modal-actions">

      <button
        type="button"
        class="secondary"
        onclick="closeJoinModal()"
      >
        Cancel
      </button>

      <button type="submit" class="primary">
        Join Club
      </button>

    </div>

  </form>

</div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* =========================================================
   MOVING STARFIELD
   ========================================================= */

const canvas =
  document.getElementById("starfield");

const ctx =
  canvas.getContext("2d");

let stars = [];
let width = 0;
let height = 0;

const STAR_DENSITY =
  0.00014;

function randomBetween(min,max){
  return Math.random() * (max - min) + min;
}

function createStar(firstLoad = false){

  const bright =
    Math.random() < .11;

  return {
    x:Math.random() * width,

    y:firstLoad
      ? Math.random() * height
      : -20,

    size:bright
      ? randomBetween(1.4,2.7)
      : randomBetween(.45,1.35),

    speed:randomBetween(.035,.14),

    drift:randomBetween(-.025,.025),

    alpha:randomBetween(.25,.9),

    twinkle:randomBetween(.006,.022),

    twinkleDirection:
      Math.random() > .5
        ? 1
        : -1,

    bright,

    tint:Math.random()
  };
}

function resizeStars(){

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  width =
    window.innerWidth;

  height =
    window.innerHeight;

  canvas.width =
    width * ratio;

  canvas.height =
    height * ratio;

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  const count =
    Math.max(
      75,
      Math.floor(
        width *
        height *
        STAR_DENSITY
      )
    );

  stars =
    Array.from(
      {
        length:Math.min(
          count,
          260
        )
      },
      () => createStar(true)
    );
}

function drawStar(star){

  let color;

  if(star.tint < .12){
    color =
      `rgba(244,216,143,${star.alpha})`;
  }
  else if(star.tint < .27){
    color =
      `rgba(170,191,255,${star.alpha})`;
  }
  else{
    color =
      `rgba(245,248,255,${star.alpha})`;
  }

  if(star.bright){

    const glow =
      ctx.createRadialGradient(
        star.x,
        star.y,
        0,
        star.x,
        star.y,
        star.size * 4.6
      );

    glow.addColorStop(0,color);

    glow.addColorStop(
      .18,
      `rgba(225,235,255,${star.alpha * .65})`
    );

    glow.addColorStop(
      1,
      "rgba(255,255,255,0)"
    );

    ctx.beginPath();

    ctx.fillStyle =
      glow;

    ctx.arc(
      star.x,
      star.y,
      star.size * 4.6,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.beginPath();

  ctx.fillStyle =
    color;

  ctx.arc(
    star.x,
    star.y,
    star.size,
    0,
    Math.PI * 2
  );

  ctx.fill();
}

function animateStars(){

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  stars.forEach(
    star => {

      star.y += star.speed;
      star.x += star.drift;

      star.alpha +=
        star.twinkle *
        star.twinkleDirection;

      if(star.alpha >= .95){
        star.alpha = .95;
        star.twinkleDirection = -1;
      }

      if(star.alpha <= .18){
        star.alpha = .18;
        star.twinkleDirection = 1;
      }

      if(star.y > height + 25){
        Object.assign(
          star,
          createStar(false)
        );
      }

      if(star.x < -20){
        star.x = width + 20;
      }

      if(star.x > width + 20){
        star.x = -20;
      }

      drawStar(star);
    }
  );

  requestAnimationFrame(
    animateStars
  );
}

window.addEventListener(
  "resize",
  resizeStars
);

resizeStars();
animateStars();

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://pnynheaaybivlexidgka.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qP03WN5DLUAUAQiMI0Gbzw_fLwXJzCH";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;
let memberships = [];
let clubs = [];

/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}

function initials(name){

  return String(name || "T")
    .split(/\s+/)
    .slice(0,2)
    .map(
      word =>
        word.charAt(0).toUpperCase()
    )
    .join("");
}

function roleLabel(member){

  if(member.is_owner){
    return "Owner";
  }

  const roles = {
    sponsor:"Sponsor",
    treasurer:"Treasurer",
    president:"President",
    vice_president:"Vice President",
    secretary:"Secretary",
    historian:"Historian",
    unassigned:"Position Not Assigned",
    other_officer:"Position Not Assigned"
  };

  if(member.role === "custom"){
    return (
      member.custom_role_name ||
      "Custom Position"
    );
  }

  return (
    roles[member.role] ||
    "Position Not Assigned"
  );
}

function showMessage(id,message){

  const element =
    document.getElementById(id);

  element.textContent =
    message;

  element.classList.add("show");
}

function clearMessage(id){

  const element =
    document.getElementById(id);

  element.textContent = "";
  element.classList.remove("show");
}

/* =========================================================
   INITIALIZE
   ========================================================= */

async function initialize(){

  const {
    data:{session}
  } =
    await supabaseClient
      .auth
      .getSession();

  if(!session){
    window.location.replace("index.html");
    return;
  }

  currentUser =
    session.user;

  await loadProfile();
  await loadClubs();

  document
    .getElementById("loadingScreen")
    .classList.add("hidden");
}

async function loadProfile(){

  const {data} =
    await supabaseClient
      .from("profiles")
      .select("full_name")
      .eq("id",currentUser.id)
      .maybeSingle();

  document
    .getElementById("userName")
    .textContent =
    data?.full_name ||
    currentUser.email ||
    "Officer";
}

async function loadClubs(){

  const {
    data:memberRows,
    error
  } =
    await supabaseClient
      .from("club_members")
      .select(
        "club_id, role, custom_role_name, permission_level, is_owner, joined_at"
      )
      .eq("user_id",currentUser.id);

  if(error){
    alert(error.message);
    return;
  }

  memberships =
    memberRows || [];

  if(!memberships.length){
    clubs = [];
    renderClubs();
    return;
  }

  const ids =
    memberships.map(
      member =>
        member.club_id
    );

  const {
    data:clubRows,
    error:clubError
  } =
    await supabaseClient
      .from("clubs")
      .select("*")
      .in("id",ids)
      .order(
        "created_at",
        {ascending:false}
      );

  if(clubError){
    alert(clubError.message);
    return;
  }

  clubs =
    clubRows || [];

  renderClubs();
}

/* =========================================================
   RENDER
   ========================================================= */

function clubCard(club,archived = false){

  const member =
    memberships.find(
      row =>
        row.club_id === club.id
    );

  if(!member){
    return "";
  }

  const logo =
    club.logo_url
      ? `
        <div class="club-logo">
          <img src="${esc(club.logo_url)}" alt="">
        </div>
      `
      : `
        <div class="club-logo">
          ${esc(initials(club.name))}
        </div>
      `;

  return `
    <article class="club-card ${archived ? "archived-card" : ""}">

      <div class="club-top">

        ${logo}

        <div class="club-title">

          <h3>
            ${esc(club.name)}
          </h3>

          <div class="role">

            ${esc(roleLabel(member))}

            ${
              member.is_owner
                ? `
                  <span class="owner-badge">
                    Owner
                  </span>
                `
                : ""
            }

          </div>

        </div>

      </div>

      <div class="club-details">

        <div class="detail">
          <span>Sponsor</span>

          <strong>
            ${esc(club.sponsor_name || "Not added")}
          </strong>
        </div>

        <div class="detail">
          <span>Invite Code</span>

          <strong class="invite-code">
            ${esc(club.invite_code || "—")}
          </strong>
        </div>

      </div>

      ${
        !archived
          ? `
            <div class="card-actions">

              <button
                class="open-btn"
                onclick="openClub('${club.id}')"
              >
                Open Workspace
              </button>

              <button
                class="copy-btn"
                onclick="copyInviteCode('${esc(club.invite_code || "")}')"
              >
                Copy Code
              </button>

            </div>
          `
          : `
            <div class="archived-actions">

              ${
                member.is_owner
                  ? `
                    <button
                      class="restore-btn"
                      onclick="restoreClub('${club.id}')"
                    >
                      Restore Club
                    </button>
                  `
                  : `
                    <div style="color:var(--muted);font-size:10px">
                      The club owner must restore this workspace.
                    </div>
                  `
              }

            </div>
          `
      }

    </article>
  `;
}

function renderClubs(){

  const active =
    clubs.filter(
      club =>
        !club.archived_at
    );

  const archived =
    clubs.filter(
      club =>
        club.archived_at
    );

  const activeGrid =
    document.getElementById("activeClubGrid");

  const archivedGrid =
    document.getElementById("archivedClubGrid");

  if(active.length){

    activeGrid.innerHTML =
      active.map(
        club =>
          clubCard(club,false)
      ).join("");

  }
  else{

    activeGrid.innerHTML = `
      <div class="empty">
        <h3>No clubs yet</h3>
        Create a club or join one using an invite code.
      </div>
    `;
  }

  if(archived.length){

    document
      .getElementById("archivedSection")
      .classList.remove("hidden");

    archivedGrid.innerHTML =
      archived.map(
        club =>
          clubCard(club,true)
      ).join("");

  }
  else{

    document
      .getElementById("archivedSection")
      .classList.add("hidden");
  }
}

/* =========================================================
   OPEN / COPY
   ========================================================= */

function openClub(id){

  sessionStorage.setItem(
    "selectedClubId",
    id
  );

  window.location.href =
    "app.html";
}

async function copyInviteCode(code){

  if(!code){
    return;
  }

  await navigator
    .clipboard
    .writeText(code);

  alert("Invite code copied!");
}

/* =========================================================
   CREATE CLUB
   ========================================================= */

function openCreateModal(){

  clearMessage("createMessage");

  document
    .getElementById("createModal")
    .classList.add("show");
}

function closeCreateModal(){

  document
    .getElementById("createModal")
    .classList.remove("show");

  document
    .getElementById("createClubForm")
    .reset();
}

async function uploadLogo(clubId,file){

  if(!file){
    return null;
  }

  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "-"
    );

  const path =
    `${clubId}/${Date.now()}-${safeName}`;

  const {error} =
    await supabaseClient
      .storage
      .from("club-logos")
      .upload(
        path,
        file
      );

  if(error){
    throw error;
  }

  const {data} =
    supabaseClient
      .storage
      .from("club-logos")
      .getPublicUrl(path);

  return data.publicUrl;
}

document
  .getElementById("createClubForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearMessage("createMessage");

      const name =
        document
          .getElementById("createClubName")
          .value
          .trim();

      const sponsor =
        document
          .getElementById("createSponsorName")
          .value
          .trim();

      const logoFile =
        document
          .getElementById("createClubLogo")
          .files?.[0];

      try{

        const {
          data,
          error
        } =
          await supabaseClient
            .rpc(
              "create_club",
              {
                club_name:name
              }
            );

        if(error){
          throw error;
        }

        let newClubId = null;

        if(typeof data === "string"){
          newClubId = data;
        }
        else if(Array.isArray(data) && data.length){
          newClubId =
            data[0]?.id ||
            data[0]?.club_id ||
            data[0];
        }
        else if(data && typeof data === "object"){
          newClubId =
            data.id ||
            data.club_id;
        }

        if(!newClubId){

          const {
            data:newest
          } =
            await supabaseClient
              .from("clubs")
              .select("id")
              .eq("created_by",currentUser.id)
              .eq("name",name)
              .order(
                "created_at",
                {ascending:false}
              )
              .limit(1)
              .maybeSingle();

          newClubId =
            newest?.id;
        }

        if(!newClubId){
          throw new Error(
            "Club created, but Treasurery could not find the new workspace."
          );
        }

        let logoUrl =
          null;

        if(logoFile){
          logoUrl =
            await uploadLogo(
              newClubId,
              logoFile
            );
        }

        const updates = {};

        if(sponsor){
          updates.sponsor_name =
            sponsor;
        }

        if(logoUrl){
          updates.logo_url =
            logoUrl;
        }

        if(Object.keys(updates).length){

          const {
            error:updateError
          } =
            await supabaseClient
              .from("clubs")
              .update(updates)
              .eq("id",newClubId);

          if(updateError){
            throw updateError;
          }
        }

        closeCreateModal();

        await loadClubs();

      }
      catch(error){

        showMessage(
          "createMessage",
          error.message
        );
      }
    }
  );

/* =========================================================
   JOIN CLUB
   ========================================================= */

function openJoinModal(){

  clearMessage("joinMessage");

  document
    .getElementById("joinModal")
    .classList.add("show");
}

function closeJoinModal(){

  document
    .getElementById("joinModal")
    .classList.remove("show");

  document
    .getElementById("joinClubForm")
    .reset();
}

document
  .getElementById("joinClubForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearMessage("joinMessage");

      const code =
        document
          .getElementById("joinInviteCode")
          .value
          .trim();

      const {
        error
      } =
        await supabaseClient
          .rpc(
            "join_club_by_code",
            {
              check_invite_code:code
            }
          );

      if(error){

        showMessage(
          "joinMessage",
          error.message
        );

        return;
      }

      closeJoinModal();

      await loadClubs();
    }
  );

/* =========================================================
   RESTORE
   ========================================================= */

async function restoreClub(id){

  if(
    !confirm(
      "Restore this club?"
    )
  ){
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .rpc(
        "restore_club",
        {
          check_club_id:id
        }
      );

  if(error){
    alert(error.message);
    return;
  }

  try{

    await supabaseClient
      .from("activity_log")
      .insert({
        club_id:id,
        actor_id:currentUser.id,
        action:"club_restored",
        details:{}
      });

  }
  catch(error){
    console.warn(error);
  }

  await loadClubs();
}

/* =========================================================
   LOGOUT
   ========================================================= */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();

      sessionStorage.clear();

      window.location.replace(
        "index.html"
      );
    }
  );

/* =========================================================
   MODAL BACKDROP
   ========================================================= */

document
  .getElementById("createModal")
  .addEventListener(
    "click",
    event => {

      if(event.target.id === "createModal"){
        closeCreateModal();
      }
    }
  );

document
  .getElementById("joinModal")
  .addEventListener(
    "click",
    event => {

      if(event.target.id === "joinModal"){
        closeJoinModal();
      }
    }
  );

/* GLOBAL */

window.openClub =
  openClub;

window.copyInviteCode =
  copyInviteCode;

window.openCreateModal =
  openCreateModal;

window.closeCreateModal =
  closeCreateModal;

window.openJoinModal =
  openJoinModal;

window.closeJoinModal =
  closeJoinModal;

window.restoreClub =
  restoreClub;

initialize();
</script>
