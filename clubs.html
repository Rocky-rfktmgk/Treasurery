<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Treasurery | Your Clubs</title>

<style>
:root{
  --space:#070b13;
  --space2:#0b1120;
  --space3:#10192b;

  --card:rgba(15,23,39,.80);
  --text:#f7f4ec;
  --muted:#8f9bb0;
  --muted2:#66738b;

  --border:rgba(255,255,255,.085);
  --gold-border:rgba(215,177,92,.22);

  --gold:#d7b15c;
  --gold2:#f3d791;
  --gold3:#96702b;
  --gold-soft:rgba(215,177,92,.12);

  --green:#50c88c;
  --green-soft:rgba(80,200,140,.12);

  --red:#ef6c76;
  --red-soft:rgba(239,108,118,.12);

  --shadow:
    0 18px 50px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.025);
}

*{
  box-sizing:border-box;
}

html{
  background:var(--space);
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(215,177,92,.08),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 15%,
      rgba(66,83,135,.12),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #070b13 0%,
      #090f1b 48%,
      #060910 100%
    );
}

body::before{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.58) 0 1px,
      transparent 1.4px
    ),
    radial-gradient(
      circle,
      rgba(215,177,92,.42) 0 1px,
      transparent 1.3px
    ),
    radial-gradient(
      circle,
      rgba(255,255,255,.24) 0 1px,
      transparent 1.2px
    );

  background-size:
    150px 150px,
    230px 230px,
    315px 315px;

  background-position:
    10px 20px,
    90px 100px,
    140px 45px;

  opacity:.30;
}

body::after{
  content:"";

  position:fixed;

  width:760px;
  height:760px;

  right:-380px;
  top:-420px;

  border-radius:50%;

  border:
    1px solid rgba(215,177,92,.07);

  box-shadow:
    0 0 130px rgba(215,177,92,.04);

  pointer-events:none;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.shell{
  position:relative;
  z-index:1;
  min-height:100vh;
}

.topbar{
  height:76px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 32px;

  background:
    rgba(7,11,19,.74);

  border-bottom:
    1px solid rgba(255,255,255,.065);

  backdrop-filter:
    blur(18px);

  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:46px;
  height:46px;

  border-radius:13px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      145deg,
      var(--gold2),
      var(--gold),
      var(--gold3)
    );

  color:#141008;

  font-size:20px;
  font-weight:1000;

  box-shadow:
    0 0 28px rgba(215,177,92,.17),
    inset 0 1px 0 rgba(255,255,255,.35);
}

.brand-name{
  font-size:20px;
  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #fff8e7,
      var(--gold2)
    );

  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
}

.user-area{
  display:flex;
  align-items:center;
  gap:16px;
}

.user-name{
  color:#b2bdce;
  font-size:12px;
  font-weight:750;
}

.logout-btn{
  border:
    1px solid rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.035);

  color:#dce2ec;

  border-radius:9px;

  padding:
    9px 13px;

  font-size:11px;
  font-weight:850;

  transition:.18s;
}

.logout-btn:hover{
  border-color:
    rgba(215,177,92,.24);

  color:var(--gold2);

  background:
    rgba(215,177,92,.06);
}

.main{
  max-width:1360px;

  margin:
    0 auto;

  padding:
    54px 30px 80px;
}

.hero{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:24px;

  margin-bottom:30px;
}

.hero h1{
  margin:
    0 0 6px;

  font-size:34px;

  letter-spacing:-1px;

  color:#fff8e8;
}

.hero p{
  margin:0;

  color:var(--muted);

  font-size:14px;
}

.hero-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.primary,
.secondary,
.danger{
  border-radius:10px;

  padding:
    11px 16px;

  font-size:12px;
  font-weight:900;

  transition:
    transform .16s ease,
    box-shadow .16s ease,
    border-color .16s ease,
    background .16s ease;
}

.primary{
  border:0;

  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );

  color:#151109;

  box-shadow:
    0 9px 25px rgba(215,177,92,.14);
}

.primary:hover{
  transform:
    translateY(-1px);

  box-shadow:
    0 12px 32px rgba(215,177,92,.22);
}

.secondary{
  border:
    1px solid rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.045);

  color:#e3e8f0;
}

.secondary:hover{
  background:
    rgba(255,255,255,.075);

  border-color:
    rgba(215,177,92,.18);

  color:var(--gold2);
}

.danger{
  border:
    1px solid rgba(239,108,118,.16);

  background:
    var(--red-soft);

  color:#ff8992;
}

.section-title{
  display:flex;
  align-items:center;
  gap:9px;

  margin:
    0 0 14px;

  color:#d9dfe9;

  font-size:11px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:1.3px;
}

.section-title::before{
  content:"✦";

  color:var(--gold);

  font-size:10px;
}

.club-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:18px;
}

.club-card{
  position:relative;

  overflow:hidden;

  padding:23px;

  border:
    1px solid var(--border);

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      rgba(18,27,45,.88),
      rgba(11,18,30,.78)
    );

  box-shadow:
    var(--shadow);

  backdrop-filter:
    blur(14px);

  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.club-card::before{
  content:"";

  position:absolute;

  left:0;
  right:0;
  top:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(215,177,92,.26),
      transparent
    );
}

.club-card::after{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-90px;
  top:-90px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(215,177,92,.08),
      transparent 68%
    );

  pointer-events:none;
}

.club-card:hover{
  transform:
    translateY(-2px);

  border-color:
    rgba(215,177,92,.18);

  box-shadow:
    0 22px 65px rgba(0,0,0,.34);
}

.club-top{
  display:flex;
  align-items:center;

  gap:14px;

  margin-bottom:20px;
}

.club-logo{
  width:56px;
  height:56px;

  border-radius:15px;

  overflow:hidden;

  display:grid;
  place-items:center;

  flex:none;

  background:
    linear-gradient(
      145deg,
      rgba(243,215,145,.95),
      rgba(215,177,92,.86)
    );

  color:#151109;

  font-size:18px;
  font-weight:1000;

  border:
    1px solid rgba(255,255,255,.14);

  box-shadow:
    0 0 24px rgba(215,177,92,.10);
}

.club-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.club-heading{
  min-width:0;
}

.club-name{
  margin:0;

  color:#f5f1e8;

  font-size:18px;

  font-weight:900;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;

  margin-top:6px;
}

.badge{
  display:inline-flex;

  padding:
    4px 7px;

  border-radius:999px;

  font-size:9px;
  font-weight:900;
}

.badge.gold{
  background:
    var(--gold-soft);

  border:
    1px solid rgba(215,177,92,.13);

  color:
    var(--gold2);
}

.badge.gray{
  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.05);

  color:#aeb8c8;
}

.badge.red{
  background:
    var(--red-soft);

  border:
    1px solid rgba(239,108,118,.14);

  color:#ff8992;
}

.info-list{
  margin-bottom:20px;
}

.info-row{
  display:flex;

  justify-content:space-between;

  gap:18px;

  padding:
    10px 0;

  border-bottom:
    1px solid rgba(255,255,255,.055);

  font-size:11px;
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  color:var(--muted);
}

.info-value{
  text-align:right;

  color:#e5e9f1;

  font-weight:800;

  overflow-wrap:anywhere;
}

.invite-code{
  color:
    var(--gold2);

  letter-spacing:.8px;
}

.club-actions{
  display:grid;

  grid-template-columns:
    1fr 1.15fr;

  gap:10px;

  margin-top:8px;
}

.club-actions.single{
  grid-template-columns:1fr;
}

.club-actions button{
  width:100%;
}

.archived-section{
  margin-top:42px;
}

.archived-card{
  opacity:.78;
}

.archived-card:hover{
  opacity:1;
}

.empty{
  border:
    1px dashed rgba(215,177,92,.16);

  border-radius:16px;

  background:
    rgba(255,255,255,.018);

  padding:
    46px 20px;

  text-align:center;
}

.empty-icon{
  width:48px;
  height:48px;

  margin:
    0 auto 12px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:
    var(--gold-soft);

  color:
    var(--gold2);

  border:
    1px solid rgba(215,177,92,.12);

  font-size:18px;
}

.empty h3{
  margin:
    0 0 6px;

  color:#f0ede7;

  font-size:15px;
}

.empty p{
  margin:
    0 auto;

  max-width:430px;

  color:
    var(--muted);

  font-size:12px;

  line-height:1.6;
}

.modal-backdrop{
  display:none;

  position:fixed;

  inset:0;

  z-index:100;

  align-items:center;
  justify-content:center;

  padding:18px;

  background:
    rgba(2,4,8,.80);

  backdrop-filter:
    blur(9px);
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:
    min(520px,100%);

  max-height:92vh;

  overflow:auto;

  padding:23px;

  border:
    1px solid rgba(215,177,92,.16);

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      #121b2c,
      #090f1a
    );

  box-shadow:
    0 32px 100px rgba(0,0,0,.58),
    0 0 55px rgba(215,177,92,.06);
}

.modal-head{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:12px;

  margin-bottom:20px;
}

.modal-head h2{
  margin:0;

  color:#fff6df;

  font-size:20px;
}

.close-btn{
  width:33px;
  height:33px;

  border:
    1px solid rgba(255,255,255,.07);

  border-radius:8px;

  background:
    rgba(255,255,255,.045);

  color:#d8dfeb;

  font-size:18px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;

  margin-bottom:7px;

  color:#d8dee9;

  font-size:11px;

  font-weight:850;
}

.field input{
  width:100%;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:9px;

  background:
    rgba(5,9,16,.56);

  color:#edf0f6;

  padding:
    11px 12px;

  outline:none;
}

.field input:focus{
  border-color:
    rgba(215,177,92,.55);

  box-shadow:
    0 0 0 3px rgba(215,177,92,.08);
}

.field input::placeholder{
  color:#5d687c;
}

.field-help{
  color:
    var(--muted2);

  font-size:9px;

  margin-top:6px;

  line-height:1.5;
}

.modal-actions{
  display:flex;

  justify-content:flex-end;

  gap:9px;

  margin-top:20px;
}

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  z-index:200;

  opacity:0;

  transform:
    translateY(10px);

  pointer-events:none;

  padding:
    11px 14px;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );

  color:#151109;

  font-size:11px;
  font-weight:900;

  box-shadow:
    0 15px 40px rgba(215,177,92,.18);

  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.loading{
  position:fixed;

  inset:0;

  z-index:500;

  display:grid;

  place-items:center;

  background:
    radial-gradient(
      circle at center,
      #101725,
      #05070d 65%
    );
}

.loading-inner{
  text-align:center;
}

.loading-mark{
  width:62px;
  height:62px;

  margin:
    0 auto 14px;

  display:grid;
  place-items:center;

  border-radius:50%;

  border:
    1px solid rgba(215,177,92,.2);

  color:
    var(--gold2);

  font-size:22px;

  box-shadow:
    0 0 45px rgba(215,177,92,.09);

  animation:
    pulse 1.8s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(.94);
    opacity:.55;
  }

  50%{
    transform:scale(1.06);
    opacity:1;
  }
}

.loading h2{
  margin:
    0 0 5px;

  color:
    var(--gold2);

  font-size:17px;
}

.loading p{
  margin:0;

  color:
    var(--muted);

  font-size:11px;
}

.hidden{
  display:none!important;
}

@media(max-width:820px){

  .club-grid{
    grid-template-columns:1fr;
  }

  .main{
    padding:
      36px 18px 60px;
  }

  .topbar{
    padding:
      0 18px;
  }
}

@media(max-width:620px){

  .hero{
    align-items:stretch;
    flex-direction:column;
  }

  .hero-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .user-name{
    display:none;
  }

  .brand-name{
    font-size:17px;
  }
}

@media(max-width:460px){

  .club-actions{
    grid-template-columns:1fr;
  }

  .hero-actions{
    grid-template-columns:1fr;
  }

  .modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div
  id="loadingScreen"
  class="loading"
>
  <div class="loading-inner">

    <div class="loading-mark">
      ✦
    </div>

    <h2>Treasurery</h2>

    <p>
      Loading your clubs...
    </p>

  </div>
</div>

<div class="shell">

<header class="topbar">

  <div class="brand">

    <div class="brand-logo">
      T
    </div>

    <div class="brand-name">
      Treasurery
    </div>

  </div>

  <div class="user-area">

    <div
      class="user-name"
      id="userName"
    >
      Officer
    </div>

    <button
      class="logout-btn"
      id="logoutButton"
    >
      Log Out
    </button>

  </div>

</header>

<main class="main">

  <div class="hero">

    <div>

      <h1>
        Your Clubs
      </h1>

      <p>
        Choose a financial workspace or create a new one.
      </p>

    </div>

    <div class="hero-actions">

      <button
        class="secondary"
        id="openJoinButton"
      >
        Join Club
      </button>

      <button
        class="primary"
        id="openCreateButton"
      >
        + Create Club
      </button>

    </div>

  </div>

  <div class="section-title">
    Active Workspaces
  </div>

  <div
    class="club-grid"
    id="clubGrid"
  ></div>

  <section
    class="archived-section hidden"
    id="archivedSection"
  >

    <div class="section-title">
      Archived Clubs
    </div>

    <div
      class="club-grid"
      id="archivedGrid"
    ></div>

  </section>

</main>

</div>

<div
  class="modal-backdrop"
  id="createModal"
>

  <div class="modal">

    <div class="modal-head">

      <h2>
        Create Club
      </h2>

      <button
        class="close-btn"
        type="button"
        onclick="closeCreateModal()"
      >
        ×
      </button>

    </div>

    <form id="createClubForm">

      <div class="field">

        <label for="newClubName">
          Club Name
        </label>

        <input
          id="newClubName"
          type="text"
          maxlength="100"
          placeholder="Example: Senior Class"
          required
        >

      </div>

      <div class="field">

        <label for="newSponsorName">
          Sponsor Name
          <span style="color:var(--muted2);font-weight:600">
            — optional
          </span>
        </label>

        <input
          id="newSponsorName"
          type="text"
          maxlength="100"
          placeholder="Example: Ms. Rodriguez"
        >

      </div>

      <div class="field">

        <label for="newClubLogo">
          Club Logo
          <span style="color:var(--muted2);font-weight:600">
            — optional
          </span>
        </label>

        <input
          id="newClubLogo"
          type="file"
          accept="image/png,image/jpeg,image/webp"
        >

        <div class="field-help">
          PNG, JPG, or WebP works best.
        </div>

      </div>

      <div class="modal-actions">

        <button
          class="secondary"
          type="button"
          onclick="closeCreateModal()"
        >
          Cancel
        </button>

        <button
          class="primary"
          id="createClubButton"
          type="submit"
        >
          Create Club
        </button>

      </div>

    </form>

  </div>

</div>

<div
  class="modal-backdrop"
  id="joinModal"
>

  <div class="modal">

    <div class="modal-head">

      <h2>
        Join Club
      </h2>

      <button
        class="close-btn"
        type="button"
        onclick="closeJoinModal()"
      >
        ×
      </button>

    </div>

    <form id="joinClubForm">

      <div class="field">

        <label for="joinCode">
          Invite Code
        </label>

        <input
          id="joinCode"
          type="text"
          maxlength="30"
          autocomplete="off"
          placeholder="Enter the club invite code"
          required
        >

        <div class="field-help">
          Ask the club owner or another officer for the invite code.
        </div>

      </div>

      <div class="modal-actions">

        <button
          class="secondary"
          type="button"
          onclick="closeJoinModal()"
        >
          Cancel
        </button>

        <button
          class="primary"
          id="joinClubButton"
          type="submit"
        >
          Join Club
        </button>

      </div>

    </form>

  </div>

</div>

<div
  class="toast"
  id="toast"
>
  Saved
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://pnynheaaybivlexidgka.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qP03WN5DLUAUAQiMI0Gbzw_fLwXJzCH";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;
let profile = null;

const roleLabels = {
  sponsor:"Sponsor",
  treasurer:"Treasurer",
  president:"President",
  vice_president:"Vice President",
  secretary:"Secretary",
  historian:"Historian",
  custom:"Custom Position",
  unassigned:"Position Not Assigned",
  other_officer:"Position Not Assigned"
};

function esc(value){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;
}

function initials(value){

  return String(
    value ||
    "T"
  )
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(
      word =>
        word
          .charAt(0)
          .toUpperCase()
    )
    .join("");
}

function roleLabel(member){

  if(
    member?.is_owner
  ){
    return "Owner";
  }

  if(
    member?.role ===
    "custom"
  ){
    return (
      member.custom_role_name ||
      "Custom Position"
    );
  }

  return (
    roleLabels[
      member?.role
    ] ||
    "Position Not Assigned"
  );
}

function dateText(value){

  if(!value){
    return "";
  }

  return new Date(
    value
  ).toLocaleDateString(
    "en-US",
    {
      month:"short",
      day:"numeric",
      year:"numeric"
    }
  );
}

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1800
    );
}

async function initialize(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();

  if(!session){

    window.location.replace(
      "index.html"
    );

    return;
  }

  currentUser =
    session.user;

  await loadProfile();

  await loadClubs();

  document
    .getElementById(
      "loadingScreen"
    )
    .classList.add(
      "hidden"
    );
}

async function loadProfile(){

  const {
    data
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "full_name"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  profile =
    data ||
    null;

  document
    .getElementById(
      "userName"
    )
    .textContent =
    profile?.full_name ||
    currentUser
      .user_metadata
      ?.full_name ||
    currentUser.email ||
    "Officer";
}

async function loadClubs(){

  const clubGrid =
    document.getElementById(
      "clubGrid"
    );

  const archivedGrid =
    document.getElementById(
      "archivedGrid"
    );

  const archivedSection =
    document.getElementById(
      "archivedSection"
    );

  clubGrid.innerHTML = `
    <div
      class="empty"
      style="grid-column:1/-1"
    >
      <div class="empty-icon">
        ✦
      </div>

      <h3>
        Loading your workspaces...
      </h3>
    </div>
  `;

  archivedGrid.innerHTML =
    "";

  const {
    data:memberships,
    error:membershipError
  } =
    await supabaseClient
      .from(
        "club_members"
      )
      .select(
        "club_id, role, custom_role_name, permission_level, is_owner, joined_at"
      )
      .eq(
        "user_id",
        currentUser.id
      );

  if(membershipError){

    clubGrid.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1"
      >
        <h3>
          Could not load your clubs
        </h3>

        <p>
          ${esc(membershipError.message)}
        </p>
      </div>
    `;

    return;
  }

  if(
    !memberships ||
    memberships.length === 0
  ){

    renderNoClubs();

    archivedSection
      .classList
      .add(
        "hidden"
      );

    return;
  }

  const clubIds =
    memberships.map(
      item =>
        item.club_id
    );

  const {
    data:clubs,
    error:clubError
  } =
    await supabaseClient
      .from(
        "clubs"
      )
      .select(
        "id, name, sponsor_name, logo_url, invite_code, archived_at, created_at"
      )
      .in(
        "id",
        clubIds
      );

  if(clubError){

    clubGrid.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1"
      >
        <h3>
          Could not load your clubs
        </h3>

        <p>
          ${esc(clubError.message)}
        </p>
      </div>
    `;

    return;
  }

  const membershipMap = {};

  memberships.forEach(
    member => {

      membershipMap[
        member.club_id
      ] =
        member;
    }
  );

  const combined =
    (clubs || [])
      .map(
        club => ({
          ...club,
          membership:
            membershipMap[
              club.id
            ]
        })
      );

  const active =
    combined
      .filter(
        club =>
          !club.archived_at
      )
      .sort(
        (a,b) =>
          a.name.localeCompare(
            b.name
          )
      );

  const archived =
    combined
      .filter(
        club =>
          Boolean(
            club.archived_at
          )
      )
      .sort(
        (a,b) =>
          new Date(
            b.archived_at
          ) -
          new Date(
            a.archived_at
          )
      );

  if(
    active.length
  ){

    clubGrid.innerHTML =
      active.map(
        club =>
          activeClubHtml(
            club
          )
      ).join("");

  }
  else{

    renderNoClubs();
  }

  if(
    archived.length
  ){

    archivedSection
      .classList
      .remove(
        "hidden"
      );

    archivedGrid.innerHTML =
      archived.map(
        club =>
          archivedClubHtml(
            club
          )
      ).join("");

  }
  else{

    archivedSection
      .classList
      .add(
        "hidden"
      );
  }
}

function renderNoClubs(){

  document
    .getElementById(
      "clubGrid"
    )
    .innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1"
      >

        <div class="empty-icon">
          ✦
        </div>

        <h3>
          Your first workspace is waiting
        </h3>

        <p>
          Create a club if you're setting up its Treasurery workspace, or join an existing club using an invite code.
        </p>

      </div>
    `;
}

function clubLogoHtml(club){

  if(
    club.logo_url
  ){

    return `
      <div class="club-logo">
        <img
          src="${esc(club.logo_url)}"
          alt=""
        >
      </div>
    `;
  }

  return `
    <div class="club-logo">
      ${esc(initials(club.name))}
    </div>
  `;
}

function activeClubHtml(club){

  const member =
    club.membership ||
    {};

  return `
    <article class="club-card">

      <div class="club-top">

        ${clubLogoHtml(club)}

        <div class="club-heading">

          <h2 class="club-name">
            ${esc(club.name)}
          </h2>

          <div class="badges">

            <span class="badge gold">
              ${esc(roleLabel(member))}
            </span>

          </div>

        </div>

      </div>

      <div class="info-list">

        <div class="info-row">

          <span class="info-label">
            Sponsor
          </span>

          <span class="info-value">
            ${esc(club.sponsor_name || "Not set")}
          </span>

        </div>

        <div class="info-row">

          <span class="info-label">
            Invite code
          </span>

          <span class="info-value invite-code">
            ${esc(club.invite_code || "—")}
          </span>

        </div>

      </div>

      <div class="club-actions">

        <button
          class="secondary"
          onclick="copyInviteCode('${club.id}')"
        >
          Copy Code
        </button>

        <button
          class="primary"
          onclick="openWorkspace('${club.id}')"
        >
          Open Workspace
        </button>

      </div>

    </article>
  `;
}

function archivedClubHtml(club){

  const member =
    club.membership ||
    {};

  const canRestore =
    Boolean(
      member.is_owner
    );

  return `
    <article
      class="club-card archived-card"
    >

      <div class="club-top">

        ${clubLogoHtml(club)}

        <div class="club-heading">

          <h2 class="club-name">
            ${esc(club.name)}
          </h2>

          <div class="badges">

            <span class="badge gold">
              ${esc(roleLabel(member))}
            </span>

            <span class="badge red">
              Archived
            </span>

          </div>

        </div>

      </div>

      <div class="info-list">

        <div class="info-row">

          <span class="info-label">
            Sponsor
          </span>

          <span class="info-value">
            ${esc(club.sponsor_name || "Not set")}
          </span>

        </div>

        <div class="info-row">

          <span class="info-label">
            Archived
          </span>

          <span class="info-value">
            ${esc(dateText(club.archived_at))}
          </span>

        </div>

      </div>

      ${
        canRestore
          ? `
            <div class="club-actions single">

              <button
                class="primary"
                onclick="restoreClub('${club.id}')"
              >
                Restore Club
              </button>

            </div>
          `
          : `
            <div
              style="
                padding-top:4px;
                color:var(--muted);
                font-size:10px;
                line-height:1.5;
              "
            >
              The club owner must restore this workspace.
            </div>
          `
      }

    </article>
  `;
}

async function copyInviteCode(
  clubId
){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("clubs")
      .select(
        "invite_code"
      )
      .eq(
        "id",
        clubId
      )
      .single();

  if(
    error ||
    !data?.invite_code
  ){

    alert(
      "Could not load the invite code."
    );

    return;
  }

  try{

    await navigator
      .clipboard
      .writeText(
        data.invite_code
      );

    showToast(
      "Invite code copied"
    );

  }
  catch{

    prompt(
      "Copy this invite code:",
      data.invite_code
    );
  }
}

function openWorkspace(
  clubId
){

  sessionStorage.setItem(
    "selectedClubId",
    clubId
  );

  window.location.href =
    "app.html";
}

function openCreateModal(){

  document
    .getElementById(
      "createClubForm"
    )
    .reset();

  document
    .getElementById(
      "createModal"
    )
    .classList.add(
      "show"
    );

  setTimeout(
    () => {

      document
        .getElementById(
          "newClubName"
        )
        .focus();

    },
    0
  );
}

function closeCreateModal(){

  document
    .getElementById(
      "createModal"
    )
    .classList.remove(
      "show"
    );
}

function openJoinModal(){

  document
    .getElementById(
      "joinClubForm"
    )
    .reset();

  document
    .getElementById(
      "joinModal"
    )
    .classList.add(
      "show"
    );

  setTimeout(
    () => {

      document
        .getElementById(
          "joinCode"
        )
        .focus();

    },
    0
  );
}

function closeJoinModal(){

  document
    .getElementById(
      "joinModal"
    )
    .classList.remove(
      "show"
    );
}

function extractClubId(data){

  if(
    typeof data ===
    "string"
  ){
    return data;
  }

  if(
    Array.isArray(data) &&
    data.length
  ){

    return (
      data[0]?.id ||
      data[0]?.club_id ||
      (
        typeof data[0] ===
        "string"
          ? data[0]
          : null
      )
    );
  }

  if(
    data &&
    typeof data ===
    "object"
  ){

    return (
      data.id ||
      data.club_id ||
      null
    );
  }

  return null;
}

async function findNewestOwnedClub(
  name
){

  const {
    data
  } =
    await supabaseClient
      .from("clubs")
      .select(
        "id"
      )
      .eq(
        "created_by",
        currentUser.id
      )
      .eq(
        "name",
        name
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(1)
      .maybeSingle();

  return (
    data?.id ||
    null
  );
}

async function uploadClubLogo(
  clubId,
  file
){

  if(!file){
    return null;
  }

  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "-"
    );

  const path =
    `${clubId}/${Date.now()}-${safeName}`;

  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        "club-logos"
      )
      .upload(
        path,
        file
      );

  if(error){
    throw error;
  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from(
        "club-logos"
      )
      .getPublicUrl(
        path
      );

  return (
    data.publicUrl ||
    null
  );
}

async function restoreClub(
  clubId
){

  if(
    !confirm(
      "Restore this club?"
    )
  ){
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .rpc(
        "restore_club",
        {
          check_club_id:
            clubId
        }
      );

  if(error){

    alert(
      "Could not restore the club: " +
      error.message
    );

    return;
  }

  try{

    await supabaseClient
      .from(
        "activity_log"
      )
      .insert({
        club_id:
          clubId,

        actor_id:
          currentUser.id,

        action:
          "club_restored",

        details:{}
      });

  }
  catch(error){

    console.warn(
      error
    );
  }

  showToast(
    "Club restored"
  );

  await loadClubs();
}

document
  .getElementById(
    "openCreateButton"
  )
  .addEventListener(
    "click",
    openCreateModal
  );

document
  .getElementById(
    "openJoinButton"
  )
  .addEventListener(
    "click",
    openJoinModal
  );

document
  .getElementById(
    "createClubForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const button =
        document.getElementById(
          "createClubButton"
        );

      const clubName =
        document
          .getElementById(
            "newClubName"
          )
          .value
          .trim();

      const sponsorName =
        document
          .getElementById(
            "newSponsorName"
          )
          .value
          .trim();

      const logoFile =
        document
          .getElementById(
            "newClubLogo"
          )
          .files?.[0] ||
        null;

      if(!clubName){
        return;
      }

      button.disabled =
        true;

      button.textContent =
        "Creating...";

      try{

        const {
          data,
          error
        } =
          await supabaseClient
            .rpc(
              "create_club",
              {
                club_name:
                  clubName
              }
            );

        if(error){
          throw error;
        }

        let newClubId =
          extractClubId(
            data
          );

        if(!newClubId){

          newClubId =
            await findNewestOwnedClub(
              clubName
            );
        }

        if(!newClubId){

          throw new Error(
            "The club was created, but Treasurery could not finish loading its profile."
          );
        }

        let logoUrl =
          null;

        if(logoFile){

          logoUrl =
            await uploadClubLogo(
              newClubId,
              logoFile
            );
        }

        const updates = {};

        if(sponsorName){

          updates.sponsor_name =
            sponsorName;
        }

        if(logoUrl){

          updates.logo_url =
            logoUrl;
        }

        if(
          Object.keys(updates)
            .length
        ){

          const {
            error:updateError
          } =
            await supabaseClient
              .from("clubs")
              .update(
                updates
              )
              .eq(
                "id",
                newClubId
              );

          if(updateError){
            throw updateError;
          }
        }

        closeCreateModal();

        showToast(
          "Club created"
        );

        await loadClubs();

      }
      catch(error){

        alert(
          "Could not create the club: " +
          error.message
        );

      }
      finally{

        button.disabled =
          false;

        button.textContent =
          "Create Club";
      }
    }
  );

document
  .getElementById(
    "joinClubForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const button =
        document.getElementById(
          "joinClubButton"
        );

      const code =
        document
          .getElementById(
            "joinCode"
          )
          .value
          .trim()
          .toUpperCase();

      if(!code){
        return;
      }

      button.disabled =
        true;

      button.textContent =
        "Joining...";

      try{

        const {
          error
        } =
          await supabaseClient
            .rpc(
              "join_club_by_code",
              {
                check_invite_code:
                  code
              }
            );

        if(error){
          throw error;
        }

        closeJoinModal();

        showToast(
          "Club joined"
        );

        await loadClubs();

      }
      catch(error){

        alert(
          "Could not join the club: " +
          error.message
        );

      }
      finally{

        button.disabled =
          false;

        button.textContent =
          "Join Club";
      }
    }
  );

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async () => {

      sessionStorage.removeItem(
        "selectedClubId"
      );

      sessionStorage.removeItem(
        "selectedClubName"
      );

      await supabaseClient
        .auth
        .signOut();

      window.location.replace(
        "index.html"
      );
    }
  );

document
  .getElementById(
    "createModal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "createModal"
      ){

        closeCreateModal();
      }
    }
  );

document
  .getElementById(
    "joinModal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "joinModal"
      ){

        closeJoinModal();
      }
    }
  );

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closeCreateModal();

      closeJoinModal();
    }
  }
);

window.copyInviteCode =
  copyInviteCode;

window.openWorkspace =
  openWorkspace;

window.restoreClub =
  restoreClub;

window.closeCreateModal =
  closeCreateModal;

window.closeJoinModal =
  closeJoinModal;

initialize();
</script>

</body>
</html>
