<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Treasurery | Your Clubs</title>

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#162033;
  --muted:#718096;
  --border:#e4e9f0;
  --blue:#4f7df3;
  --blue-dark:#3e68d6;
  --blue-soft:#edf3ff;
  --green:#2fa36b;
  --green-soft:#eaf8f0;
  --red:#df5a63;
  --red-soft:#fff0f1;
  --shadow:0 10px 30px rgba(20,30,50,.07);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.topbar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:0 28px;
  background:white;
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:var(--blue);
  color:white;
  font-weight:900;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-name{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.logout{
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:8px;
  background:white;
  color:var(--text);
  font-size:11px;
  font-weight:800;
}

.main{
  width:min(1100px,100%);
  margin:0 auto;
  padding:42px 24px 70px;
}

.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
}

.page-head h1{
  margin:0 0 6px;
  font-size:30px;
}

.page-head p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.head-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.primary,
.secondary{
  border:0;
  padding:10px 14px;
  border-radius:9px;
  font-size:12px;
  font-weight:850;
}

.primary{
  color:white;
  background:var(--blue);
}

.primary:hover{
  background:var(--blue-dark);
}

.secondary{
  color:var(--text);
  background:#edf0f5;
}

.club-grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:16px;
}

.club-card{
  min-height:250px;
  display:flex;
  flex-direction:column;
  padding:20px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--card);
  box-shadow:var(--shadow);
}

.club-top{
  display:flex;
  align-items:flex-start;
  gap:13px;
}

.club-logo{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:13px;
  background:var(--blue-soft);
  color:var(--blue);
  font-size:18px;
  font-weight:900;
}

.club-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.club-title{
  min-width:0;
  flex:1;
}

.club-title h2{
  margin:1px 0 5px;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.role{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  color:var(--blue);
  background:var(--blue-soft);
  font-size:9px;
  font-weight:900;
}

.club-info{
  display:grid;
  gap:8px;
  margin:20px 0;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding-bottom:8px;
  border-bottom:1px solid #f0f2f6;
  font-size:11px;
}

.info-row span{
  color:var(--muted);
}

.info-row strong{
  text-align:right;
}

.club-actions{
  margin-top:auto;
  display:flex;
  gap:8px;
}

.club-actions button{
  flex:1;
}

.open-btn{
  border:0;
  padding:10px;
  border-radius:9px;
  background:var(--blue);
  color:white;
  font-size:11px;
  font-weight:900;
}

.copy-btn{
  border:1px solid var(--border);
  padding:10px;
  border-radius:9px;
  background:white;
  color:var(--text);
  font-size:11px;
  font-weight:800;
}

.archived-section{
  margin-top:42px;
  padding-top:28px;
  border-top:1px solid var(--border);
}

.archived-head{
  margin-bottom:16px;
}

.archived-head h2{
  margin:0 0 5px;
  font-size:20px;
}

.archived-head p{
  margin:0;
  color:var(--muted);
  font-size:12px;
}

.archived-card{
  opacity:.88;
}

.archived-badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  background:#eef1f5;
  color:#677386;
  font-size:9px;
  font-weight:900;
}

.restore-btn{
  width:100%;
  margin-top:auto;
  border:0;
  padding:10px;
  border-radius:9px;
  background:var(--green-soft);
  color:var(--green);
  font-size:11px;
  font-weight:900;
}

.empty{
  grid-column:1/-1;
  padding:60px 25px;
  border:1px dashed #cfd6df;
  border-radius:16px;
  text-align:center;
  background:white;
}

.empty h2{
  margin:0 0 8px;
  font-size:18px;
}

.empty p{
  margin:0 0 18px;
  color:var(--muted);
  font-size:12px;
}

.loading{
  grid-column:1/-1;
  padding:50px;
  color:var(--muted);
  text-align:center;
  font-size:12px;
}

.message{
  display:none;
  margin-bottom:17px;
  padding:11px 13px;
  border-radius:9px;
  font-size:11px;
  line-height:1.5;
}

.message.show{
  display:block;
}

.message.error{
  color:#9b343b;
  background:var(--red-soft);
}

.message.success{
  color:#226246;
  background:var(--green-soft);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(5,10,18,.62);
  z-index:100;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  border-radius:17px;
  background:white;
  box-shadow:
    0 25px 70px
    rgba(0,0,0,.25);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
  font-size:19px;
}

.close{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#f0f2f5;
  font-size:18px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:11px;
  font-weight:850;
}

.field input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
}

.field input:focus{
  border-color:var(--blue);
  box-shadow:
    0 0 0 3px
    rgba(79,125,243,.08);
}

.field-help{
  margin-top:5px;
  color:var(--muted);
  font-size:9px;
  line-height:1.5;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  padding:11px 14px;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:11px;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

@media(max-width:900px){
  .club-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }
}

@media(max-width:620px){

  .topbar{
    padding:0 16px;
  }

  .user-name{
    display:none;
  }

  .main{
    padding:28px 16px 60px;
  }

  .page-head{
    flex-direction:column;
  }

  .head-actions{
    width:100%;
  }

  .head-actions button{
    flex:1;
  }

  .club-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="logo">
      T
    </div>

    Treasurery

  </div>

  <div class="user-area">

    <div
      class="user-name"
      id="userName"
    >
      Loading...
    </div>

    <button
      class="logout"
      id="logoutButton"
      type="button"
    >
      Log Out
    </button>

  </div>

</header>

<main class="main">

  <div class="page-head">

    <div>

      <h1>
        Your Clubs
      </h1>

      <p>
        Choose a club workspace or create a new one.
      </p>

    </div>

    <div class="head-actions">

      <button
        class="secondary"
        id="joinClubButton"
        type="button"
      >
        Join Club
      </button>

      <button
        class="primary"
        id="createClubButton"
        type="button"
      >
        + Create Club
      </button>

    </div>

  </div>

  <div
    id="pageMessage"
    class="message"
  ></div>

  <div
    class="club-grid"
    id="clubGrid"
  >

    <div class="loading">
      Loading your clubs...
    </div>

  </div>

  <section
    class="archived-section"
    id="archivedSection"
    style="display:none"
  >

    <div class="archived-head">

      <h2>
        Archived Clubs
      </h2>

      <p>
        Restore a club when you need to use it again.
      </p>

    </div>

    <div
      class="club-grid"
      id="archivedGrid"
    ></div>

  </section>

</main>

<div
  class="modal-backdrop"
  id="createModal"
>

  <div class="modal">

    <div class="modal-head">

      <h2>
        Create Club
      </h2>

      <button
        class="close"
        type="button"
        onclick="closeCreateModal()"
      >
        ×
      </button>

    </div>

    <form id="createClubForm">

      <div class="field">

        <label for="clubName">
          Club Name
        </label>

        <input
          id="clubName"
          type="text"
          maxlength="80"
          placeholder="Example: Senior Class"
          required
        >

      </div>

      <div class="field">

        <label for="sponsorName">
          Sponsor Name
        </label>

        <input
          id="sponsorName"
          type="text"
          maxlength="100"
          placeholder="Optional"
        >

      </div>

      <div class="field">

        <label for="clubLogo">
          Club Logo
        </label>

        <input
          id="clubLogo"
          type="file"
          accept="image/png,image/jpeg,image/webp"
        >

        <div class="field-help">
          Optional. PNG, JPG, or WebP works best.
        </div>

      </div>

      <div class="modal-actions">

        <button
          class="secondary"
          type="button"
          onclick="closeCreateModal()"
        >
          Cancel
        </button>

        <button
          class="primary"
          id="saveClubButton"
          type="submit"
        >
          Create Club
        </button>

      </div>

    </form>

  </div>

</div>

<div
  class="modal-backdrop"
  id="joinModal"
>

  <div class="modal">

    <div class="modal-head">

      <h2>
        Join Club
      </h2>

      <button
        class="close"
        type="button"
        onclick="closeJoinModal()"
      >
        ×
      </button>

    </div>

    <form id="joinClubForm">

      <div class="field">

        <label for="inviteCode">
          Invite Code
        </label>

        <input
          id="inviteCode"
          type="text"
          autocomplete="off"
          placeholder="Enter club invite code"
          required
        >

        <div class="field-help">
          Ask the club owner or sponsor for the invite code.
        </div>

      </div>

      <div class="modal-actions">

        <button
          class="secondary"
          type="button"
          onclick="closeJoinModal()"
        >
          Cancel
        </button>

        <button
          class="primary"
          id="joinButton"
          type="submit"
        >
          Join Club
        </button>

      </div>

    </form>

  </div>

</div>

<div
  class="toast"
  id="toast"
>
  Copied
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://pnynheaaybivlexidgka.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qP03WN5DLUAUAQiMI0Gbzw_fLwXJzCH";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;

const roleNames = {
  sponsor:"Sponsor",
  treasurer:"Treasurer",
  president:"President",
  vice_president:"Vice President",
  secretary:"Secretary",
  historian:"Historian",
  custom:"Custom Position",
  unassigned:"Position Not Assigned",
  other_officer:"Position Not Assigned"
};

function showMessage(
  text,
  type = "error"
){

  const box =
    document.getElementById(
      "pageMessage"
    );

  box.textContent =
    text;

  box.className =
    "message show " +
    type;
}

function clearMessage(){

  const box =
    document.getElementById(
      "pageMessage"
    );

  box.textContent =
    "";

  box.className =
    "message";
}

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1700
    );
}

function escapeHtml(value){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;
}

function initials(name){

  return String(
    name ||
    "T"
  )
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(
      word =>
        word.charAt(0)
          .toUpperCase()
    )
    .join("");
}

function memberPositionLabel(
  membership
){

  if(
    membership?.role ===
    "custom"
  ){

    return (
      membership.custom_role_name ||
      "Custom Position"
    );
  }

  return (
    roleNames[
      membership?.role
    ] ||
    "Position Not Assigned"
  );
}

function setButtonLoading(
  button,
  loading,
  normalText,
  loadingText
){

  button.disabled =
    loading;

  button.textContent =
    loading
      ? loadingText
      : normalText;
}

async function initializePage(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();

  if(!session){

    window.location.replace(
      "index.html"
    );

    return;
  }

  currentUser =
    session.user;

  await loadUserName();

  await loadClubs();
}

async function loadUserName(){

  const {
    data
  } =
    await supabaseClient
      .from(
        "profiles"
      )
      .select(
        "full_name"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  const name =
    data?.full_name ||
    currentUser
      .user_metadata
      ?.full_name ||
    currentUser.email ||
    "Officer";

  document
    .getElementById(
      "userName"
    )
    .textContent =
    name;
}

function activeClubCardHtml(
  membership
){

  const club =
    membership.clubs;

  const role =
    membership.is_owner
      ? "Owner"
      : memberPositionLabel(
          membership
        );

  const logo =
    club.logo_url
      ? `
        <img
          src="${escapeHtml(club.logo_url)}"
          alt=""
        >
      `
      : initials(
          club.name
        );

  return `
    <article class="club-card">

      <div class="club-top">

        <div class="club-logo">
          ${logo}
        </div>

        <div class="club-title">

          <h2>
            ${escapeHtml(club.name)}
          </h2>

          <span class="role">
            ${escapeHtml(role)}
          </span>

        </div>

      </div>

      <div class="club-info">

        <div class="info-row">

          <span>
            Sponsor
          </span>

          <strong>
            ${escapeHtml(
              club.sponsor_name ||
              "Not set"
            )}
          </strong>

        </div>

        <div class="info-row">

          <span>
            Invite code
          </span>

          <strong>
            ${escapeHtml(
              club.invite_code
            )}
          </strong>

        </div>

      </div>

      <div class="club-actions">

        <button
          class="copy-btn"
          type="button"
          onclick="copyInviteCode(
            '${club.invite_code}'
          )"
        >
          Copy Code
        </button>

        <button
          class="open-btn"
          type="button"
          onclick="openWorkspace(
            '${club.id}',
            '${membership.role}',
            ${membership.is_owner}
          )"
        >
          Open Workspace
        </button>

      </div>

    </article>
  `;
}

function archivedClubCardHtml(
  membership
){

  const club =
    membership.clubs;

  const role =
    membership.is_owner
      ? "Owner"
      : memberPositionLabel(
          membership
        );

  const logo =
    club.logo_url
      ? `
        <img
          src="${escapeHtml(club.logo_url)}"
          alt=""
        >
      `
      : initials(
          club.name
        );

  const archivedDate =
    club.archived_at
      ? new Date(
          club.archived_at
        )
          .toLocaleDateString(
            "en-US",
            {
              month:"short",
              day:"numeric",
              year:"numeric"
            }
          )
      : "";

  return `
    <article
      class="club-card archived-card"
    >

      <div class="club-top">

        <div class="club-logo">
          ${logo}
        </div>

        <div class="club-title">

          <h2>
            ${escapeHtml(club.name)}
          </h2>

          <span class="role">
            ${escapeHtml(role)}
          </span>

        </div>

        <span class="archived-badge">
          Archived
        </span>

      </div>

      <div class="club-info">

        <div class="info-row">

          <span>
            Sponsor
          </span>

          <strong>
            ${escapeHtml(
              club.sponsor_name ||
              "Not set"
            )}
          </strong>

        </div>

        <div class="info-row">

          <span>
            Archived
          </span>

          <strong>
            ${escapeHtml(
              archivedDate ||
              "Recently"
            )}
          </strong>

        </div>

      </div>

      ${
        membership.is_owner
          ? `
            <button
              class="restore-btn"
              type="button"
              onclick="restoreClub(
                '${club.id}'
              )"
            >
              Restore Club
            </button>
          `
          : `
            <div
              style="
                font-size:10px;
                color:var(--muted);
                margin-top:auto
              "
            >
              Only the club owner can restore this club.
            </div>
          `
      }

    </article>
  `;
}

async function loadClubs(){

  clearMessage();

  const grid =
    document.getElementById(
      "clubGrid"
    );

  const archivedSection =
    document.getElementById(
      "archivedSection"
    );

  const archivedGrid =
    document.getElementById(
      "archivedGrid"
    );

  grid.innerHTML = `
    <div class="loading">
      Loading your clubs...
    </div>
  `;

  archivedSection.style.display =
    "none";

  archivedGrid.innerHTML =
    "";

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "club_members"
      )
      .select(`
        club_id,
        role,
        custom_role_name,
        permission_level,
        is_owner,
        clubs (
          id,
          name,
          invite_code,
          logo_url,
          sponsor_name,
          archived_at
        )
      `)
      .eq(
        "user_id",
        currentUser.id
      );

  if(error){

    console.error(
      error
    );

    grid.innerHTML =
      "";

    showMessage(
      "Could not load your clubs: " +
      error.message
    );

    return;
  }

  const allMemberships =
    (data || [])
      .filter(
        membership =>
          membership.clubs
      );

  const activeMemberships =
    allMemberships
      .filter(
        membership =>
          !membership
            .clubs
            .archived_at
      );

  const archivedMemberships =
    allMemberships
      .filter(
        membership =>
          Boolean(
            membership
              .clubs
              .archived_at
          )
      );

  activeMemberships.sort(
    (a,b) =>
      String(
        a.clubs.name
      )
        .localeCompare(
          String(
            b.clubs.name
          )
        )
  );

  archivedMemberships.sort(
    (a,b) =>
      String(
        a.clubs.name
      )
        .localeCompare(
          String(
            b.clubs.name
          )
        )
  );

  if(
    activeMemberships.length ===
    0
  ){

    grid.innerHTML = `
      <div class="empty">

        <h2>
          No active clubs
        </h2>

        <p>
          Create a club or join one with an invite code.
        </p>

        <button
          class="primary"
          type="button"
          onclick="openCreateModal()"
        >
          + Create Your First Club
        </button>

      </div>
    `;

  }
  else{

    grid.innerHTML =
      activeMemberships
        .map(
          activeClubCardHtml
        )
        .join("");
  }

  if(
    archivedMemberships.length
  ){

    archivedSection.style.display =
      "block";

    archivedGrid.innerHTML =
      archivedMemberships
        .map(
          archivedClubCardHtml
        )
        .join("");
  }
}

function openWorkspace(
  clubId,
  role,
  isOwner
){

  sessionStorage.setItem(
    "selectedClubId",
    clubId
  );

  sessionStorage.setItem(
    "selectedClubRole",
    role
  );

  sessionStorage.setItem(
    "selectedClubOwner",
    String(isOwner)
  );

  window.location.href =
    "app.html";
}

async function copyInviteCode(
  code
){

  try{

    await navigator
      .clipboard
      .writeText(
        code
      );

    showToast(
      "Invite code copied"
    );

  }
  catch{

    showToast(
      "Invite code: " +
      code
    );
  }
}

async function restoreClub(
  clubId
){

  const {
    error
  } =
    await supabaseClient
      .rpc(
        "restore_club",
        {
          check_club_id:
            clubId
        }
      );

  if(error){

    showMessage(
      "Could not restore the club: " +
      error.message
    );

    return;
  }

  await supabaseClient
    .from(
      "activity_log"
    )
    .insert({
      club_id:
        clubId,
      actor_id:
        currentUser.id,
      action:
        "club_restored",
      details:{}
    });

  showMessage(
    "Club restored successfully.",
    "success"
  );

  await loadClubs();
}

function openCreateModal(){

  clearMessage();

  document
    .getElementById(
      "createClubForm"
    )
    .reset();

  document
    .getElementById(
      "createModal"
    )
    .classList.add(
      "show"
    );

  setTimeout(
    () => {

      document
        .getElementById(
          "clubName"
        )
        .focus();

    },
    0
  );
}

function closeCreateModal(){

  document
    .getElementById(
      "createModal"
    )
    .classList.remove(
      "show"
    );
}

function openJoinModal(){

  clearMessage();

  document
    .getElementById(
      "joinClubForm"
    )
    .reset();

  document
    .getElementById(
      "joinModal"
    )
    .classList.add(
      "show"
    );

  setTimeout(
    () => {

      document
        .getElementById(
          "inviteCode"
        )
        .focus();

    },
    0
  );
}

function closeJoinModal(){

  document
    .getElementById(
      "joinModal"
    )
    .classList.remove(
      "show"
    );
}

async function uploadClubLogo(
  clubId,
  file
){

  if(!file){
    return null;
  }

  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "-"
      );

  const filePath =
    clubId +
    "/" +
    Date.now() +
    "-" +
    safeName;

  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        "club-logos"
      )
      .upload(
        filePath,
        file,
        {
          cacheControl:
            "3600",
          upsert:false
        }
      );

  if(error){
    throw error;
  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from(
        "club-logos"
      )
      .getPublicUrl(
        filePath
      );

  return (
    data?.publicUrl ||
    null
  );
}

document
  .getElementById(
    "createClubButton"
  )
  .addEventListener(
    "click",
    openCreateModal
  );

document
  .getElementById(
    "joinClubButton"
  )
  .addEventListener(
    "click",
    openJoinModal
  );

document
  .getElementById(
    "createClubForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearMessage();

      const name =
        document
          .getElementById(
            "clubName"
          )
          .value
          .trim();

      const sponsorName =
        document
          .getElementById(
            "sponsorName"
          )
          .value
          .trim();

      const logoFile =
        document
          .getElementById(
            "clubLogo"
          )
          .files?.[0] ||
        null;

      const button =
        document
          .getElementById(
            "saveClubButton"
          );

      setButtonLoading(
        button,
        true,
        "Create Club",
        "Creating..."
      );

      try{

        const {
          data:clubId,
          error:createError
        } =
          await supabaseClient
            .rpc(
              "create_club",
              {
                club_name:
                  name
              }
            );

        if(createError){
          throw createError;
        }

        let logoUrl =
          null;

        if(logoFile){

          logoUrl =
            await uploadClubLogo(
              clubId,
              logoFile
            );
        }

        const updates = {};

        if(sponsorName){

          updates.sponsor_name =
            sponsorName;
        }

        if(logoUrl){

          updates.logo_url =
            logoUrl;
        }

        if(
          Object.keys(
            updates
          ).length
        ){

          const {
            error:updateError
          } =
            await supabaseClient
              .from(
                "clubs"
              )
              .update(
                updates
              )
              .eq(
                "id",
                clubId
              );

          if(updateError){
            throw updateError;
          }
        }

        closeCreateModal();

        showMessage(
          "Club created successfully.",
          "success"
        );

        await loadClubs();

      }
      catch(error){

        console.error(
          error
        );

        showMessage(
          "Could not create the club: " +
          error.message
        );

      }
      finally{

        setButtonLoading(
          button,
          false,
          "Create Club",
          "Creating..."
        );
      }
    }
  );

document
  .getElementById(
    "joinClubForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearMessage();

      const code =
        document
          .getElementById(
            "inviteCode"
          )
          .value
          .trim();

      const button =
        document
          .getElementById(
            "joinButton"
          );

      setButtonLoading(
        button,
        true,
        "Join Club",
        "Joining..."
      );

      const {
        error
      } =
        await supabaseClient
          .rpc(
            "join_club_by_code",
            {
              code
            }
          );

      setButtonLoading(
        button,
        false,
        "Join Club",
        "Joining..."
      );

      if(error){

        showMessage(
          "Could not join the club: " +
          error.message
        );

        return;
      }

      closeJoinModal();

      showMessage(
        "You joined the club successfully.",
        "success"
      );

      await loadClubs();
    }
  );

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async () => {

      const {
        error
      } =
        await supabaseClient
          .auth
          .signOut();

      if(error){

        showMessage(
          "Could not log out: " +
          error.message
        );

        return;
      }

      sessionStorage.clear();

      window.location.replace(
        "index.html"
      );
    }
  );

document
  .getElementById(
    "createModal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "createModal"
      ){

        closeCreateModal();
      }
    }
  );

document
  .getElementById(
    "joinModal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "joinModal"
      ){

        closeJoinModal();
      }
    }
  );

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closeCreateModal();
      closeJoinModal();
    }
  }
);

window.openCreateModal =
  openCreateModal;

window.closeCreateModal =
  closeCreateModal;

window.openJoinModal =
  openJoinModal;

window.closeJoinModal =
  closeJoinModal;

window.openWorkspace =
  openWorkspace;

window.copyInviteCode =
  copyInviteCode;

window.restoreClub =
  restoreClub;

initializePage();
</script>
